<!DOCTYPE html>
<html lang="es">
<head>
	<title>BarNet - Conectado</title>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<meta http-equiv="pragma" content="no-cache" />
	<meta http-equiv="expires" content="-1" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
	<meta http-equiv="refresh" content="8; url=$(link-status)">
	
	<link rel="stylesheet" href="CSS/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="CSS/style.css">

	<script type="text/javascript">
		function startClock() {
			$(if popup == 'true')
			open('$(link-status)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=290,height=200');
			$(endif)
			location.href = '$(link-status)';
		}
	</script>
</head>
<body onLoad="setTimeout('startClock()', 8000)">

	<div class="container">
		<div class="d-flex justify-content-center h-100">
			<div class="card text-center">
				
				<div class="card-header">
					<img src="img/logo.png" alt="BarNet" class="responsive-img logo-img">
					<h3>¡BIENVENIDO!</h3>
				</div>

				<div class="card-body">
					<div class="notice-banner">
						CONEXIÓN EXITOSA A BARNET
					</div>

					<p style="color: #fff; font-size: 0.9rem;">
						Cargando el estado de tus megas disponibles...
					</p>

					<a href="$(link-status)" class="btn login_btn">
						Ver mi consumo ahora
					</a>

					<div class="footer-brand">BarNet Soluciones Digitales</div>
				</div>

			</div>
		</div>
	</div>

</body>
</html>
