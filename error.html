<!DOCTYPE html>
<html lang="es">
<head>
	<title>BarNet - Aviso del Sistema</title>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<meta http-equiv="pragma" content="no-cache" />
	<meta http-equiv="expires" content="-1" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
	
	<link rel="stylesheet" href="CSS/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="CSS/style.css">
</head>
<body>

	<div class="container">
		<div class="d-flex justify-content-center h-100">
			<div class="card text-center">
				
				<div class="card-header">
					<img src="img/logo.png" alt="BarNet" class="responsive-img logo-img">
					<h3>AVISO DEL SISTEMA</h3>
				</div>

				<div class="card-body">
					<div class="notice-banner" style="background-color: #dc3545; color: #fff;">
						$(error)
					</div>

					<p style="color: #fff; font-size: 0.9rem;">
						Vuelve a la página principal para iniciar sesión nuevamente.
					</p>

					<a href="$(link-login)" class="btn login_btn">
						Ir al Inicio
					</a>

					<div class="footer-brand">BarNet Soluciones Digitales</div>
				</div>

			</div>
		</div>
	</div>

</body>
</html>
